# Profile for GitHub Actions. Contains no secrets: every sensitive value comes from environment variables.
retail_pulse:
  target: ci
  outputs:
    # PR: write to the CI database, in per-PR schemas (PR_<number>_STAGING, PR_<number>_MARTS...)
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: GITHUB_CI
      role: CI_RUNNER
      private_key_path: "{{ env_var('CI_PRIVATE_KEY_PATH') }}"
      database: RETAIL_PULSE_CI
      warehouse: RETAIL_CI_WH
      schema: "{{ env_var('CI_SCHEMA') }}"
      threads: 4
    # Only used to generate manifest.json describing production (builds nothing): points at the production database
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: GITHUB_CI
      role: CI_RUNNER
      private_key_path: "{{ env_var('CI_PRIVATE_KEY_PATH') }}"
      database: RETAIL_PULSE
      warehouse: RETAIL_CI_WH
      schema: DBT_DEV
      threads: 4
