
name: 'retail_pulse'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'retail_pulse'


model-paths: ["models"]
# analysis-paths: ["analyses"]
test-paths: ["tests"]
# seed-paths: ["seeds"]
macro-paths: ["macros"]
# snapshot-paths: ["snapshots"]

clean-targets:         
  - "target"
  - "dbt_packages"

vars:
  local_tz: "Asia/Ho_Chi_Minh"
  date_start: "2020-01-01"
  date_days: 4018

models:
  retail_pulse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      # Read access for Preset (REPORTER) and slim CI (CI_RUNNER), production only (spec 003).
      # The list must hold every role that reads the marts: the incremental fct_sales revokes, on each
      # run, any grant that is not listed here. Dev and CI declare none.
      +grants: "{{ {'select': ['REPORTER', 'CI_RUNNER']} if target.name == 'prod' else {} }}"
