version: 2

models:
  - name: int_product_scd2
    description: >
      Product dimension, SCD Type 2. Tracks changes to unit_cost, unit_price,
      category_id and brand_id. product_sku and product_name are Type 1 (latest value).
      The first version starts at 1900-01-01; the current version has valid_to = 9999-12-31.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - product_id
              - valid_from
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(valid_to = '9999-12-31'::timestamp) = is_current"
    columns:
      - name: product_id
        description: Product ID (natural key).
        data_tests:
          - not_null
      - name: valid_from
        description: When the version takes effect.
        data_tests:
          - not_null
      - name: valid_to
        description: When the version stops being valid (exclusive). 9999-12-31 for the current version.
        data_tests:
          - not_null
      - name: is_current
        description: TRUE for the current version.
        data_tests:
          - not_null
      - name: unit_price
        data_tests:
          - not_null
      - name: unit_cost
        data_tests:
          - not_null

  - name: int_employee_scd2
    description: >
      Employee dimension, SCD Type 2, one row per version. Only store_id has tracked history;
      employee_name (first_name and last_name combined), salary, address, start_date and end_date are Type 1
      (latest value). date_of_birth and phone_number are excluded. The first version starts at 1900-01-01;
      the current version has valid_to = 9999-12-31.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - employee_id
              - valid_from
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(valid_to = '9999-12-31'::timestamp) = is_current"
      
    columns:
      - name: employee_id
        description: Employee ID (natural key); repeats across versions.
        data_tests:
          - not_null
      - name: valid_from
        description: When the version takes effect (inclusive).
        data_tests:
          - not_null
      - name: valid_to
        description: When the version stops being valid (exclusive). 9999-12-31 for the current version.
        data_tests:
          - not_null
      - name: store_id
        description: Store the employee works at in this version.
        data_tests:
          - not_null
      - name: is_current
        description: TRUE for the current version.
        data_tests:
          - not_null
