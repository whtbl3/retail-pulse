version: 2

models:
  - name: stg_store
    description: Stores, one row per store. RAW is loaded with replace, so no dedup is needed.
    columns:
      - name: store_id
        description: Store primary key (renamed from id).
        data_tests:
          - unique
          - not_null

  - name: stg_category
    description: Product categories, one row per category. RAW is loaded with replace, so no dedup is needed.
    columns:
      - name: category_id
        description: Category primary key (renamed from id).
        data_tests:
          - unique
          - not_null

  - name: stg_brand
    description: Brands, one row per brand. RAW is loaded with replace, so no dedup is needed.
    columns:
      - name: brand_id
        description: Brand primary key (renamed from id).
        data_tests:
          - unique
          - not_null

  - name: stg_promotion
    description: Promotions, one row per promotion. RAW is loaded with replace, so no dedup is needed.
    columns:
      - name: promotion_id
        description: Promotion primary key (renamed from id).
        data_tests:
          - unique
          - not_null
      - name: type
        description: Discount type, percentage or fixed_amount (a fixed amount per unit).
        data_tests:
          - accepted_values:
              values: ['percentage', 'fixed_amount']

  - name: stg_promotion_product
    description: Bridge between promotions and products, one row per (promotion_id, product_id) pair.
    columns:
      - name: product_id
        description: Product the promotion applies to.
        data_tests:
          - not_null
      - name: promotion_id
        description: Promotion that applies to the product.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - promotion_id
            - product_id

  - name: stg_payment_method
    description: Payment methods, one row per method. RAW is loaded with replace, so no dedup is needed.
    columns:
      - name: payment_method_id
        description: Payment method primary key (renamed from id).
        data_tests:
          - unique
          - not_null
  
  - name: stg_product
    description: Every product version, one row per (product_id, updated_at). Duplicates at the dlt cursor boundary are removed, but history is kept so the intermediate layer can build SCD2.
    columns:
      - name: product_id
        description: Product ID (renamed from id). Repeats across versions, so it is not unique on its own.
        data_tests:
          - not_null
      - name: updated_at
        description: When this version took effect; used to order versions.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - product_id
            - updated_at

  - name: stg_employee
    description: Every employee version, one row per (employee_id, updated_at). Duplicates at the dlt cursor boundary are removed; history is kept to build SCD2. Includes salary (sensitive; dim_employee takes the latest value).
    columns:
      - name: employee_id
        description: Employee ID (renamed from id). Repeats across versions, so it is not unique on its own.
        data_tests:
          - not_null
      - name: updated_at
        description: When this version took effect; used to order versions.
        data_tests:
          - not_null
      - name: store_id
        description: Store the employee works at in this version. The only column with tracked history (SCD2).
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - employee_id
            - updated_at

  - name: stg_sales_transaction
    description: Sales transactions, one row per transaction_id. Duplicates at the dlt cursor boundary are removed. Keeps only status = completed; the status column is dropped because it no longer distinguishes rows.
    columns:
      - name: transaction_id
        description: Transaction primary key.
        data_tests:
          - unique
          - not_null
      - name: store_id
        description: Store where the transaction happened.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_store')
              field: store_id
      - name: employee_id
        description: Sales employee.
        data_tests:
          - not_null
      - name: payment_method_id
        description: Payment method.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_payment_method')
              field: payment_method_id

  - name: stg_sales_transaction_item
    description: Transaction line items, one row per (transaction_id, line_number). Duplicates at the dlt cursor boundary are removed. Keeps only lines of completed transactions.
    columns:
      - name: transaction_id
        description: Transaction this line belongs to.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_sales_transaction')
              field: transaction_id
      - name: promotion_id
        description: Promotion applied to this line; null if there is none.
        data_tests:
          - relationships:
              to: ref('stg_promotion')
              field: promotion_id
      - name: product_id
        description: Product sold. No relationships test because stg_product has several versions per product_id; fact-to-dim checks are done in marts.
        data_tests:
          - not_null
      - name: line_number
        description: Line number within the transaction.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - transaction_id
            - line_number
