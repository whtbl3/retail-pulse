version: 2

sources:
  - name: raw
    description: OLTP data loaded into Snowflake by dlt. Incremental tables are append-only, so they can hold several versions and duplicate rows at the cursor boundary.
    database: RETAIL_PULSE
    schema: RAW
    tables:
      - name: store
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
      - name: category
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
      - name: brand
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
      - name: promotion
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
      - name: promotion_product
        columns:
          - name: product_id
            data_tests:
              - not_null
          - name: promotion_id
            data_tests:
              - not_null
      - name: payment_method
        columns:
          - name: id
            data_tests:
              - unique
              - not_null

      # Append incremental: several versions per id; SCD2 is built in intermediate
      # (no unique test because id repeats across versions)
      - name: product
        columns:
          - name: id
            data_tests:
              - not_null
      - name: employee
        columns:
          - name: id
            data_tests:
              - not_null

      # Append incremental: source of fct_sales
      - name: sales_transaction
        config:
          loaded_at_field: created_at
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 3, period: day}
        columns:
          - name: transaction_id
            data_tests:
              - not_null
      - name: sales_transaction_item
        columns:
          - name: transaction_id
            data_tests:
              - not_null
          - name: line_number
            data_tests:
              - not_null
