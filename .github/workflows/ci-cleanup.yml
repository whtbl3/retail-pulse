# When a pull request is merged or closed: drop its PR_<number>_* schemas in RETAIL_PULSE_CI (spec 003).
# CI keeps them after each run so reviewers can inspect what the PR built.
name: CI cleanup

on:
  pull_request:
    types: [closed]

# Same group as ci.yml: a CI run still in progress is cancelled, so it cannot recreate the schemas
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drop-pr-schemas:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      CI_SCHEMA: PR_${{ github.event.pull_request.number }}
      DBT_PROFILES_DIR: dbt/ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Write the private key to a temp file
        env:
          CI_PRIVATE_KEY: ${{ secrets.CI_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$CI_PRIVATE_KEY" > "$RUNNER_TEMP/ci_key.p8"
          echo "CI_PRIVATE_KEY_PATH=$RUNNER_TEMP/ci_key.p8" >> "$GITHUB_ENV"
      - run: uv run dbt deps --project-dir dbt
      - run: uv run dbt run-operation drop_target_schemas --project-dir dbt --target ci
