# Every pull request: lint Python, run pytest against PostgreSQL, then slim CI for dbt (builds only changed models and their dependents).
# The dbt steps run only when the PR changes dbt/ (except *.example files), pyproject.toml, uv.lock or this file.
name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # download the manifest from a previous run

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check src tests .claude/hooks
      - run: uv run ruff format --check src tests .claude/hooks

  # pytest against a real PostgreSQL (same as `make test`); no Snowflake needed
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail
          POSTGRES_DB: retail_oltp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U retail -d retail_oltp"
          --health-interval 3s
          --health-retries 10
    env:
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_USER: retail
      PG_PASSWORD: retail
      PG_DB: retail_oltp
      # test_orchestration loads the dbt manifest. `dbt parse` does not connect to Snowflake, so it uses the CI profile
      # with dummy values and no secrets.
      DBT_PROFILES_DIR: dbt/ci
      SNOWFLAKE_ACCOUNT: unused
      CI_PRIVATE_KEY_PATH: /dev/null
      CI_SCHEMA: unused
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run dbt deps --project-dir dbt
      - run: uv run dbt parse --project-dir dbt
      - run: uv run pytest

  dbt-slim-ci:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      CI_SCHEMA: PR_${{ github.event.pull_request.number }}
      DBT_PROFILES_DIR: dbt/ci
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history is needed to diff against the base branch

      # A docs-only PR skips the dbt steps. The job still reports green (so the required check does not hang);
      # only the steps below with an `if` condition are skipped.
      - name: Does the PR change dbt?
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Example files (*.example) are documentation only and do not affect dbt
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -vE '\.example$' \
              | grep -qE '^(dbt/|pyproject\.toml$|uv\.lock$|\.github/workflows/ci\.yml$)'; then
            echo "dbt=true" >> "$GITHUB_OUTPUT"
          else
            echo "dbt=false" >> "$GITHUB_OUTPUT"
            echo "PR does not change dbt, skipping the dbt steps."
          fi

      - uses: astral-sh/setup-uv@v5
        if: steps.changes.outputs.dbt == 'true'
      - run: uv sync --frozen
        if: steps.changes.outputs.dbt == 'true'
      - name: Write the private key to a temp file
        if: steps.changes.outputs.dbt == 'true'
        env:
          CI_PRIVATE_KEY: ${{ secrets.CI_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$CI_PRIVATE_KEY" > "$RUNNER_TEMP/ci_key.p8"
          echo "CI_PRIVATE_KEY_PATH=$RUNNER_TEMP/ci_key.p8" >> "$GITHUB_ENV"
      - run: uv run dbt deps --project-dir dbt
        if: steps.changes.outputs.dbt == 'true'

      - name: Download the production manifest (if any)
        if: steps.changes.outputs.dbt == 'true'
        run: |
          RUN_ID=$(gh run list --workflow=manifest.yml --branch=main --status=success \
            --limit=1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --name prod-manifest --dir state
          fi

      - name: dbt build (slim if a manifest exists, otherwise full build)
        if: steps.changes.outputs.dbt == 'true'
        run: |
          if [ -f state/manifest.json ]; then
            uv run dbt build --project-dir dbt --select state:modified+ --defer --state "$GITHUB_WORKSPACE/state"
          else
            echo "No production manifest yet, running a full build."
            uv run dbt build --project-dir dbt
          fi

      - name: Drop the PR schemas
        if: always() && steps.changes.outputs.dbt == 'true'
        run: uv run dbt run-operation drop_ci_schemas --project-dir dbt
